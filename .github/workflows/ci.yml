name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev,quality]"

      - name: Source invariants
        run: python scripts/check_source_invariants.py

      - name: Ruff
        run: ruff check aiprod_adaptation pipeline production scripts

      - name: Mypy
        run: mypy aiprod_adaptation --strict

      - name: Pytest
        run: pytest aiprod_adaptation/tests pipeline/tests production/tests -v --tb=short

      - name: Tests must not modify snapshots
        run: git diff --exit-code -- "**/__snapshots__/**"
