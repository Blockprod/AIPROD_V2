[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiprod-adaptation"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "structlog>=21.0",
    "requests>=2.28",
]

[project.scripts]
aiprod = "aiprod_adaptation.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]
quality = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scikit-image>=0.21",
]
cloud = [
    "anthropic",
    "google-genai",
    "replicate",
    "runwayml",
    "PyJWT",
    "openai",
    "elevenlabs",
]
local-image = [
    "Pillow>=10.0",
    "requests>=2.28",
]
local-audio = [
    "soundfile>=0.12",
]
local-all = [
    "aiprod-adaptation[local-image,local-audio]",
]
llm = [
    "anthropic",
    "google-genai",
]
image = [
    "replicate",
    "Pillow>=10.0",
    "rembg>=2.0",
]
reference = [
    "Pillow>=10.0",
    "numpy>=1.24",
]
video = [
    "runwayml",
    "requests",
    "PyJWT",
]
audio = [
    "openai",
    "elevenlabs",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["aiprod_adaptation*"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^aiprod_adaptation/tests/"]

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "requests.*",
    "replicate.*",
    "runwayml.*",
    "jwt.*",
    "elevenlabs.*",
    "openai.*",
    "google.*",
    "numpy",
    "numpy.*",
    "PIL",
    "PIL.*",
    "rembg",
    "rembg.*",
    "f5_tts.*",
    "soundfile.*",
    "audiocraft.*",
    "torchaudio.*",
    "torch",
    "torch.*",
    "huggingface_hub.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aiprod_adaptation.core.reference_image.*"]
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["aiprod_adaptation/tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests as integration tests (excluded from CI, require external API keys)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "_archive",
    "_tools",
    "pipeline/test_*.py",
    "production/benchmark_characters.py",
    "production/dashboard.py",
    "production/gen_3d_assets.py",
    "production/gen_assembly.py",
    "production/gen_character_bodies.py",
    "production/gen_character_faces.py",
    "production/gen_character_meshes.py",
    "production/gen_character_refs.py",
    "production/gen_character_sheets.py",
    "production/gen_location_angles.py",
    "production/gen_location_coverage.py",
    "production/gen_location_refs.py",
    "production/gen_metahuman_rigs.py",
    "third_party",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"pipeline/tests/*.py" = ["E402", "N806"]
